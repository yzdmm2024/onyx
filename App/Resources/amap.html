<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body, #map { width: 100%; height: 100%; }
  body { background: #ebedf0; }
</style>
<script src="https://webapi.amap.com/maps?v=1.4.15&key=__AMAP_KEY__&plugin=AMap.Scale,AMap.ToolBar"></script>
</head>
<body>
<div id="map"></div>
<script>
  var map = null;
  var marker = null;

  function log(msg) {
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.onyx) {
      window.webkit.messageHandlers.onyx.postMessage({ type: 'log', text: String(msg) });
    }
  }

  function reportError(msg) {
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.onyx) {
      window.webkit.messageHandlers.onyx.postMessage({ type: 'error', text: String(msg) });
    }
  }

  function postTap(lng, lat) {
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.onyx) {
      window.webkit.messageHandlers.onyx.postMessage({ type: 'tap', lng: lng, lat: lat });
    }
  }

  function initMap() {
    try {
      map = new AMap.Map('map', {
        resizeEnable: true,
        zoom: 11,
        center: [116.397428, 39.90923],
        zooms: [3, 20]
      });
      map.addControl(new AMap.Scale());
      map.addControl(new AMap.ToolBar({ position: 'RB' }));

      map.on('click', function(e) {
        var p = e.lnglat;
        setMarker(p.getLng(), p.getLat());
        postTap(p.getLng(), p.getLat());
      });

      log('AMap initialized');
    } catch (err) {
      reportError('AMap init failed: ' + err.message);
    }
  }

  function setCenter(lng, lat, zoom, showMarker) {
    if (!map) return;
    try {
      map.setZoomAndCenter(zoom || 14, [lng, lat]);
      if (showMarker) setMarker(lng, lat);
    } catch (err) {
      reportError('setCenter failed: ' + err.message);
    }
  }

  function setMarker(lng, lat) {
    if (!map) return;
    try {
      if (marker) {
        marker.setPosition([lng, lat]);
      } else {
        marker = new AMap.Marker({
          position: [lng, lat],
          map: map,
          draggable: false,
          animation: 'AMAP_ANIMATION_DROP'
        });
      }
    } catch (err) {
      reportError('setMarker failed: ' + err.message);
    }
  }

  function zoomIn() {
    if (map) map.zoomIn();
  }

  function zoomOut() {
    if (map) map.zoomOut();
  }

  window.onerror = function(msg, url, line) {
    reportError('JS error: ' + msg + ' (' + line + ')');
  };

  document.addEventListener('DOMContentLoaded', initMap);
</script>
</body>
</html>
