<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#aadaff;
    font-family:-apple-system,system-ui,"PingFang SC",sans-serif;}
  #map{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:#aadaff;}
  #map.dragging{cursor:grabbing;}
  .tile{position:absolute;left:0;top:0;width:256px;height:256px;pointer-events:none;
    -webkit-user-drag:none;user-select:none;}
  #marker{position:absolute;width:26px;height:26px;margin-left:-13px;margin-top:-26px;
    pointer-events:none;display:none;
    background:radial-gradient(circle at 50% 42%, #ff3b30 0 7px, rgba(255,59,48,.35) 8px 13px, transparent 14px);
    border-radius:50%;}
  #marker:after{content:"";position:absolute;left:50%;top:25px;width:2px;height:11px;
    background:#ff3b30;transform:translateX(-50%);border-radius:1px;}
  .ctrl{position:absolute;right:12px;width:40px;height:40px;border-radius:10px;
    background:rgba(255,255,255,.94);box-shadow:0 1px 5px rgba(0,0,0,.3);
    display:flex;align-items:center;justify-content:center;font-size:26px;color:#222;
    user-select:none;-webkit-user-select:none;line-height:1;}
  #zin{top:14px;} #zout{top:62px;}
  #hint{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.55);color:#fff;
    font-size:12px;padding:6px 10px;border-radius:8px;max-width:62%;line-height:1.4;}
</style>
</head>
<body>
<div id="map"><div id="marker"></div></div>
<div id="zin" class="ctrl">+</div>
<div id="zout" class="ctrl">&minus;</div>
<div id="hint">拖动平移 · 点击选点 · 右上角 +/− 缩放</div>
<script>
(function(){
  var mapEl=document.getElementById('map');
  var markerEl=document.getElementById('marker');
  var TILE=256;
  var state={zoom:11,clng:121.4737,clat:31.2304,mlng:null,mlat:null};

  function clampZoom(z){return Math.max(3,Math.min(18,z));}
  function lngLatToWorld(lng,lat,z){
    var n=Math.pow(2,z);
    var x=(lng+180)/360*n;
    var s=Math.sin(lat*Math.PI/180);
    var y=(0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*n;
    return {x:x*TILE,y:y*TILE};
  }
  function worldToLngLat(x,y,z){
    var n=Math.pow(2,z);
    var lng=x/TILE/n*360-180;
    var lat=Math.atan(Math.sinh(Math.PI-(2*y/TILE/n*Math.PI*2)))*180/Math.PI;
    return {lng:lng,lat:lat};
  }
  function tileUrl(x,y,z){
    var sub=1+((x+y)%4);
    return 'https://wprd0'+sub+'.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=7&x='+x+'&y='+y+'&z='+z;
  }
  function render(){
    var w=mapEl.clientWidth,h=mapEl.clientHeight;
    if(!w||!h) return;
    var c=lngLatToWorld(state.clng,state.clat,state.zoom);
    var ox=w/2-c.x, oy=h/2-c.y;
    var old=mapEl.querySelectorAll('.tile');
    for(var i=0;i<old.length;i++) old[i].remove();
    var n=Math.pow(2,state.zoom);
    var minX=Math.floor((-ox)/TILE), maxX=Math.floor((w-ox)/TILE);
    var minY=Math.floor((-oy)/TILE), maxY=Math.floor((h-oy)/TILE);
    for(var tx=minX;tx<=maxX;tx++){
      for(var ty=minY;ty<=maxY;ty++){
        if(tx<0||ty<0||tx>=n||ty>=n) continue;
        var img=document.createElement('img');
        img.className='tile';
        img.style.left=(ox+tx*TILE)+'px';
        img.style.top=(oy+ty*TILE)+'px';
        img.src=tileUrl(tx,ty,state.zoom);
        img.onerror=function(){this.style.visibility='hidden';};
        mapEl.appendChild(img);
      }
    }
    if(state.mlng!==null){
      var m=lngLatToWorld(state.mlng,state.mlat,state.zoom);
      markerEl.style.left=(ox+m.x)+'px';
      markerEl.style.top=(oy+m.y)+'px';
      markerEl.style.display='block';
    } else { markerEl.style.display='none'; }
  }
  function panBy(dx,dy){
    var c=lngLatToWorld(state.clng,state.clat,state.zoom);
    var p=worldToLngLat(c.x-dx,c.y-dy,state.zoom);
    state.clng=p.lng; state.clat=p.lat; render();
  }
  var dragging=false,moved=false,sx=0,sy=0,lx=0,ly=0;
  function tapAt(px,py){
    var w=mapEl.clientWidth,h=mapEl.clientHeight;
    var c=lngLatToWorld(state.clng,state.clat,state.zoom);
    var ox=w/2-c.x, oy=h/2-c.y;
    var p=worldToLngLat(ox+px,oy+py,state.zoom);
    state.mlng=p.lng; state.mlat=p.lat; render();
    if(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.onyx){
      window.webkit.messageHandlers.onyx.postMessage({type:'tap',lng:p.lng,lat:p.lat});
    }
  }
  mapEl.addEventListener('mousedown',function(e){dragging=true;moved=false;sx=lx=e.clientX;sy=ly=e.clientY;mapEl.classList.add('dragging');});
  window.addEventListener('mouseup',function(e){ if(dragging&&!moved) tapAt(e.clientX,e.clientY); dragging=false;mapEl.classList.remove('dragging');});
  window.addEventListener('mousemove',function(e){ if(!dragging)return; var dx=e.clientX-lx,dy=e.clientY-ly; if(Math.abs(e.clientX-sx)>4||Math.abs(e.clientY-sy)>4)moved=true; lx=e.clientX;ly=e.clientY; panBy(dx,dy);});
  mapEl.addEventListener('touchstart',function(e){ if(e.touches.length===1){dragging=true;moved=false;sx=lx=e.touches[0].clientX;sy=ly=e.touches[0].clientY;mapEl.classList.add('dragging');}},{passive:true});
  mapEl.addEventListener('touchmove',function(e){ if(!dragging||e.touches.length!==1)return; var dx=e.touches[0].clientX-lx,dy=e.touches[0].clientY-ly; if(Math.abs(e.touches[0].clientX-sx)>4||Math.abs(e.touches[0].clientY-sy)>4)moved=true; lx=e.touches[0].clientX;ly=e.touches[0].clientY; panBy(dx,dy); e.preventDefault();},{passive:false});
  mapEl.addEventListener('touchend',function(e){ if(dragging&&!moved) tapAt(lx,ly); dragging=false;mapEl.classList.remove('dragging');});
  document.getElementById('zin').onclick=function(){state.zoom=clampZoom(state.zoom+1);render();};
  document.getElementById('zout').onclick=function(){state.zoom=clampZoom(state.zoom-1);render();};
  // native bridge
  window.onyxSet=function(lng,lat,z,hasMarker){
    if(typeof z==='number') state.zoom=clampZoom(z);
    state.clng=lng; state.clat=lat;
    if(hasMarker){ state.mlng=lng; state.mlat=lat; }
    render();
  };
  window.onyxClearMarker=function(){ state.mlng=null; state.mlat=null; render(); };
  window.onyxZoom=function(z){ state.zoom=clampZoom(z); render(); };
  render();
  // tell native we are ready so it can push the initial coords
  if(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.onyx){
    window.webkit.messageHandlers.onyx.postMessage({type:'ready'});
  }
  window.addEventListener('resize',render);
})();
</script>
</body>
</html>
