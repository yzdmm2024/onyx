# ============ Onyx CI：rootless 双架构出包 deb ============
# 公开仓库 macos-latest 走免费 macOS 额度；theos + Apple ld64 出正确绑定
# arm64（无根 Dopamine/palera1n）+ arm64e（隐根 relaxin/RootHide）各自出独立 deb
name: Build Onyx

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (theos + tools)
        run: |
          brew install ldid dpkg xz 2>/dev/null || true
          sudo mkdir -p /opt/theos
          sudo chown $(whoami) /opt/theos
          git clone --recursive https://github.com/theos/theos.git /opt/theos
          # 新 Xcode SDK 不再附带私有框架 tbd，用 theos 官方 14.5 SDK 链接 Preferences.framework
          rm -rf /opt/theos/sdks
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /opt/theos/sdks
          cd /opt/theos/sdks && git sparse-checkout set iPhoneOS14.5.sdk

      - name: Build dual-arch debs
        # theos 在 rootless 模式下会按 ARCHS 自动生成 _iphoneos-arm64 / _iphoneos-arm64e
        # 两个不同文件名的 deb，且 control 的 Architecture 字段也随之正确，无需再 sed 改写。
        run: |
          export THEOS=/opt/theos
          for A in arm64 arm64e; do
            echo "=== make package ARCH=$A ==="
            make clean >/dev/null 2>&1 || true
            make package FINALPACKAGE=1 ARCHS="$A" THEOS_PACKAGE_SCHEME=rootless || exit 1
          done
          echo "--- packages produced ---"
          ls -la packages/

      - name: Sign OnyxApp entitlements (per arch)
        # 每个架构 deb 都要重签名 App 二进制的 entitlements（network.client / mapkit / 定位等）。
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          for DEB in packages/*.deb; do
            echo "=== signing: $DEB ==="
            W=$(mktemp -d)
            dpkg-deb -x "$DEB" "$W/root"
            dpkg-deb -e "$DEB" "$W/root/DEBIAN"
            APP="$W/root/var/jb/Applications/OnyxApp.app/OnyxApp"
            if [ ! -f "$APP" ]; then
              echo "OnyxApp binary missing in $DEB"; exit 1
            fi
            ldid -S"$GITHUB_WORKSPACE/App/OnyxApp.entitlements" "$APP"
            ldid -e "$APP" | grep -E "network.client|personal-information.location|mapkit|get-task-allow" || true
            BASE=$(basename "$DEB")
            rm -f "$GITHUB_WORKSPACE/packages/$BASE"
            dpkg-deb -b "$W/root" "$GITHUB_WORKSPACE/packages/$BASE"
          done

      - name: Verify entitlements
        run: |
          cd "$GITHUB_WORKSPACE"
          for DEB in packages/*.deb; do
            W=$(mktemp -d); dpkg-deb -x "$DEB" "$W/root"
            APP="$W/root/var/jb/Applications/OnyxApp.app/OnyxApp"
            if [ -f "$APP" ]; then
              ldid -e "$APP" | grep -qE "network.client" && echo "ENTITLEMENTS_OK $DEB" || echo "ENTITLEMENTS_MISSING $DEB"
            fi
          done

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Onyx-debs
          path: packages/*.deb
          if-no-files-found: error
