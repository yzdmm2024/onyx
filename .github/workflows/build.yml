# ============ Onyx CI：rootless 构建出 deb ============
# 公开仓库 macos-latest 走免费 macOS 额度；theos + Apple ld64 出正确绑定
name: Build Onyx

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid xz 2>/dev/null || true
          sudo mkdir -p /opt/theos
          sudo chown $(whoami) /opt/theos
          git clone --recursive https://github.com/theos/theos.git /opt/theos
          # 新 Xcode SDK 不再附带私有框架 tbd，用 theos 官方 14.5 SDK 链接 Preferences.framework
          rm -rf /opt/theos/sdks
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /opt/theos/sdks
          cd /opt/theos/sdks && git sparse-checkout set iPhoneOS14.5.sdk

      - name: Build package (rootless)
        run: |
          export THEOS=/opt/theos
          make clean 2>/dev/null || true
          make package FINALPACKAGE=1

      - name: Inject network entitlements into OnyxApp
        # theos 的 make package 在 macOS 上不会把 OnyxApp_CODESIGN_ENTITLEMENTS 签进 App 二进制，
        # 导致越狱 App 在沙箱里被系统判定无网络权限（NSURLErrorNotConnectedToInternet -1009）。
        # 这里解包 deb -> ldid 显式签 entitlements -> 重包 deb。
        run: |
          cd "$GITHUB_WORKSPACE"
          DEB=$(ls packages/*.deb)
          echo "source deb: $DEB"
          WORK=/tmp/onyx_ent
          rm -rf "$WORK" && mkdir -p "$WORK"
          cd "$WORK"
          ar x "$GITHUB_WORKSPACE/$DEB"
          mkdir -p payload
          if [ -f data.tar.lzma ]; then xz -dc data.tar.lzma | tar -xf - -C payload; fi
          if [ -f data.tar.gz ]; then tar -zxf data.tar.gz -C payload; fi
          if [ -f data.tar.xz ]; then xz -dc data.tar.xz | tar -xf - -C payload; fi
          APP=$(find payload -name OnyxApp -type f | head -1)
          echo "signing: $APP"
          ldid -S"$GITHUB_WORKSPACE/App/OnyxApp.entitlements" "$APP"
          echo "--- verify entitlements in binary ---"
          strings "$APP" | grep -c "network.client" || true
          # repack
          tar -cf - -C payload . | xz -9 -F lzma -c > data.tar.lzma
          BASE=$(basename "$DEB")
          rm -f "$GITHUB_WORKSPACE/$DEB"
          ar rcs "$GITHUB_WORKSPACE/packages/$BASE" debian-binary control.tar.gz data.tar.lzma
          echo "rebuilt deb: $BASE"

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: Onyx
          path: |
            packages/*.deb
          if-no-files-found: error
