# ============ Onyx CI：rootless 双架构出包 deb ============
# 公开仓库 macos-latest 走免费 macOS 额度；theos + Apple ld64 出正确绑定
# arm64（无根 Dopamine/palera1n）+ arm64e（隐根 relaxin/RootHide）各自出 deb
name: Build Onyx

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid xz 2>/dev/null || true
          sudo mkdir -p /opt/theos
          sudo chown $(whoami) /opt/theos
          git clone --recursive https://github.com/theos/theos.git /opt/theos
          # 新 Xcode SDK 不再附带私有框架 tbd，用 theos 官方 14.5 SDK 链接 Preferences.framework
          rm -rf /opt/theos/sdks
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /opt/theos/sdks
          cd /opt/theos/sdks && git sparse-checkout set iPhoneOS14.5.sdk

      - name: Build package (rootless)
        run: |
          export THEOS=/opt/theos
          make clean 2>/dev/null || true
          make package FINALPACKAGE=1

      - name: List built debs
        run: |
          echo "--- packages/ ---"
          ls -la packages/ 2>/dev/null || echo "(no packages/ dir)"
          echo "--- .theos/debs/ ---"
          ls -la .theos/debs/ 2>/dev/null || echo "(no .theos/debs dir)"
          # 多架构时把各架构 deb 收集到 packages/（若 theos 没自动放）
          mkdir -p packages
          cp .theos/debs/*.deb packages/ 2>/dev/null || true
          ls -la packages/

      - name: Inject network/mapkit entitlements into OnyxApp (loop over deb)
        # 每个架构 deb 都要重签名 App 二进制的 entitlements（network.client / mapkit 等）。
        # 用 dpkg-deb 解包/重包（标准 deb 工具，正确处理 GNU 长名格式）。
        run: |
          set -e
          brew install dpkg 2>/dev/null || true
          cd "$GITHUB_WORKSPACE"
          WORK=/tmp/onyx_ent
          for DEB in packages/*.deb; do
            echo "=== processing: $DEB ==="
            rm -rf "$WORK" && mkdir -p "$WORK/root"
            dpkg-deb -x "$DEB" "$WORK/root"
            dpkg-deb -e "$DEB" "$WORK/root/DEBIAN"
            APP="$WORK/root/var/jb/Applications/OnyxApp.app/OnyxApp"
            echo "signing: $APP"
            if [ -f "$APP" ]; then
              ldid -S"$GITHUB_WORKSPACE/App/OnyxApp.entitlements" "$APP"
            else
              echo "  (App binary not found at $APP, skipping sign)"; continue
            fi
            echo "--- 签名后的 entitlements ---"
            ldid -e "$APP" | grep -E "network.client|mapkit|get-task-allow|personal-information.location" || true
            BASE=$(basename "$DEB")
            rm -f "$GITHUB_WORKSPACE/packages/$BASE"
            dpkg-deb -b "$WORK/root" "$GITHUB_WORKSPACE/packages/$BASE"
            echo "rebuilt deb: $BASE"
          done

      - name: Verify entitlements in repacked debs
        run: |
          cd "$GITHUB_WORKSPACE"
          WORK=/tmp/onyx_verify
          for DEB in packages/*.deb; do
            echo "=== verifying: $DEB ==="
            rm -rf "$WORK" && mkdir -p "$WORK/root"
            dpkg-deb -x "$DEB" "$WORK/root"
            APP="$WORK/root/var/jb/Applications/OnyxApp.app/OnyxApp"
            if [ -f "$APP" ]; then
              ldid -e "$APP" | grep -E "network.client|mapkit" && echo "ENTITLEMENTS_OK" || echo "ENTITLEMENTS_MISSING"
            else
              echo "  (no OnyxApp binary — tweak-only deb)"
            fi
          done

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Onyx
          path: |
            packages/*.deb
          if-no-files-found: error