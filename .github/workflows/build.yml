# ============ Onyx CI：rootless 双架构出包 deb，并发布到越狱源 ============
# arm64（无根 Dopamine/palera1n）+ arm64e（隐根 relaxin/RootHide）各自出独立 deb
name: Build & Publish Onyx

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (theos + tools)
        run: |
          brew install make dpkg ldid gpatch libplist || true
          sudo mkdir -p /opt/theos
          sudo chown $(whoami) /opt/theos
          git clone --recursive https://github.com/theos/theos.git /opt/theos
          # 14.5 SDK（Makefile TARGET 要求），sparse 拉取避免整库
          rm -rf /opt/theos/sdks
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /opt/theos/sdks
          cd /opt/theos/sdks && git sparse-checkout set iPhoneOS14.5.sdk
          echo "THEOS=/opt/theos" >> "$GITHUB_ENV"
          echo "PATH=/opt/theos/bin:$PATH" >> "$GITHUB_ENV"

      - name: Build dual-arch debs
        run: |
          set -e
          export THEOS=/opt/theos
          export PATH="$THEOS/bin:$PATH"
          make clean >/dev/null 2>&1 || true
          # 修复 maintainer scripts 权限（theos 要求 >=0555）
          chmod 0755 postinst prerm 2>/dev/null || true
          # 1) 一次 fat 构建（arm64+arm64e）→ iphoneos-arm64.deb（rootless/Dopamine，fat 二进制）
          make package FINALPACKAGE=1 ARCHS="arm64 arm64e" THEOS_PACKAGE_SCHEME=rootless
          ls -la packages/

          # 2) 从 fat 包派生 iphoneos-arm64e.deb 供隐根 relaxin/RootHide 使用
          #    （仅改写 control 的 Architecture 字段，二进制仍含 arm64e 切片）
          W=$(mktemp -d)
          dpkg-deb -x packages/*.deb "$W/root"
          dpkg-deb -e packages/*.deb "$W/root/DEBIAN"
          sed -i '' 's/^Architecture:.*/Architecture: iphoneos-arm64e/' "$W/root/DEBIAN/control"
          VERSION=$(grep '^Version:' "$W/root/DEBIAN/control" | sed 's/^Version: *//')
          echo "--- derived arm64e control ---"
          grep -E '^(Package|Architecture|Version):' "$W/root/DEBIAN/control"
          # 另存派生 arm64e deb（文件名使用 control 中的真实版本号）
          dpkg-deb -b "$W/root" "packages/com.yzdmm.onyx_${VERSION}_iphoneos-arm64e.deb"
          echo "--- final packages ---"
          ls -la packages/

          # 3) 手动注入 postinst（theos 有时不会自动打包）
          for DEB in packages/*.deb; do
            W=$(mktemp -d)
            dpkg-deb -x "$DEB" "$W/root"
            dpkg-deb -e "$DEB" "$W/root/DEBIAN"
            if [ -f preinst ]; then
              cp preinst "$W/root/DEBIAN/preinst"
              chmod 0755 "$W/root/DEBIAN/preinst"
              echo "injected preinst into $DEB"
            fi
            if [ -f postinst ]; then
              cp postinst "$W/root/DEBIAN/postinst"
              chmod 0755 "$W/root/DEBIAN/postinst"
              echo "injected postinst into $DEB"
            fi
            if [ -f prerm ]; then
              cp prerm "$W/root/DEBIAN/prerm"
              chmod 0755 "$W/root/DEBIAN/prerm"
              echo "injected prerm into $DEB"
            fi
            if [ -f postrm ]; then
              cp postrm "$W/root/DEBIAN/postrm"
              chmod 0755 "$W/root/DEBIAN/postrm"
              echo "injected postrm into $DEB"
            fi
            rm -f "$DEB"
            dpkg-deb -b "$W/root" "$DEB"
            rm -rf "$W"
          done
          echo "--- after postinst injection ---"
          ls -la packages/

      - name: Sign OnyxApp entitlements (per arch)
        run: |
          set -e
          for DEB in packages/*.deb; do
            echo "=== signing: $DEB ==="
            W=$(mktemp -d)
            dpkg-deb -x "$DEB" "$W/root"
            dpkg-deb -e "$DEB" "$W/root/DEBIAN"
            # 用 ldid 把 entitlements 签进 App 二进制（locationd.simulation / network / 定位等）
            APP=$(find "$W/root" -name OnyxApp -type f | head -1)
            if [ -z "$APP" ]; then echo "FAIL: OnyxApp 未在 $DEB 中找到"; exit 1; fi
            ldid -SApp/OnyxApp.entitlements "$APP"
            echo "SIGNED $APP"
            rm -f "$DEB"
            dpkg-deb -b "$W/root" "$DEB"
            echo "REPACKED $DEB"
          done

      - name: Verify entitlements
        run: |
          set -e
          for DEB in packages/*.deb; do
            W=$(mktemp -d)
            dpkg-deb -x "$DEB" "$W/root"
            APP=$(find "$W/root" -name OnyxApp -type f | head -1)
            if [ -z "$APP" ]; then echo "FAIL: OnyxApp 未找到 -> $DEB"; exit 1; fi
            ldid -e "$APP" 2>/dev/null | grep -q 'platform-application' \
              && echo "OK ents: $DEB" \
              || { echo "FAIL: 未签入 platform-application -> $DEB"; exit 1; }
          done

      - name: Strip DIR entries (protect ellekit DynamicLibraries symlink)
        run: |
          set -e
          # 必须是所有 dpkg-deb -x/-b 重打包步骤之后执行：
          # 剥离 data.tar 里 var/jb/Library 子树的目录条目，防止 dpkg 卸载时
          # 回收空目录连带删掉 ellekit 的 DynamicLibraries 符号链接
          # （relaxin/RootHide 实证 → "Ellekit files are corrupted" 弹窗）。
          # 脚本自带回读校验（无 Library 目录条目 + dylib 仍在）。
          python3 ci_strip_dirs.py packages/*.deb

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Onyx-debs
          path: packages/*.deb
