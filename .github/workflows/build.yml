# ============ Onyx CI：rootless 构建出 deb ============
# 公开仓库 macos-latest 走免费 macOS 额度；theos + Apple ld64 出正确绑定
name: Build Onyx

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install ldid xz 2>/dev/null || true
          sudo mkdir -p /opt/theos
          sudo chown $(whoami) /opt/theos
          git clone --recursive https://github.com/theos/theos.git /opt/theos
          # 新 Xcode SDK 不再附带私有框架 tbd，用 theos 官方 14.5 SDK 链接 Preferences.framework
          rm -rf /opt/theos/sdks
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /opt/theos/sdks
          cd /opt/theos/sdks && git sparse-checkout set iPhoneOS14.5.sdk

      - name: Build package (rootless)
        run: |
          export THEOS=/opt/theos
          make clean 2>/dev/null || true
          make package FINALPACKAGE=1

      - name: Inject network/mapkit entitlements into OnyxApp
        # theos 的 <app>_ENTITLEMENTS 在 CI 环境不生效，这里用 ldid 显式把 entitlements 签进 App 二进制。
        # 解包 deb -> ldid 签名 -> 重包 deb（gzip 格式，dpkg 通用）。
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          DEB=$(ls packages/*.deb)
          echo "source deb: $DEB"
          WORK=/tmp/onyx_ent
          rm -rf "$WORK" && mkdir -p "$WORK/payload"
          cd "$WORK"
          ar x "$GITHUB_WORKSPACE/$DEB"
          if [ -f data.tar.lzma ]; then xz -dc data.tar.lzma | tar -xf - -C payload; fi
          if [ -f data.tar.gz ]; then tar -zxf data.tar.gz -C payload; fi
          if [ -f data.tar.xz ]; then xz -dc data.tar.xz | tar -xf - -C payload; fi
          APP=$(find payload -name OnyxApp -type f | head -1)
          echo "signing: $APP"
          ldid -S"$GITHUB_WORKSPACE/App/OnyxApp.entitlements" "$APP"
          echo "--- 签名后的 entitlements ---"
          ldid -e "$APP" | grep -E "network.client|mapkit|get-task-allow|personal-information.location" || true
          tar -zcf data.tar.gz -C payload .
          rm -f data.tar.lzma data.tar.xz
          BASE=$(basename "$DEB")
          rm -f "$GITHUB_WORKSPACE/packages/$BASE"
          ar rcs "$GITHUB_WORKSPACE/packages/$BASE" debian-binary control.tar.gz data.tar.gz
          echo "rebuilt deb: $BASE"

      - name: Verify entitlements in repacked deb
        run: |
          cd "$GITHUB_WORKSPACE"
          DEB=$(ls packages/*.deb)
          WORK=/tmp/onyx_verify
          rm -rf "$WORK" && mkdir -p "$WORK"
          cd "$WORK"
          ar x "$DEB"
          if [ -f data.tar.gz ]; then tar -zxf data.tar.gz; fi
          if [ -f data.tar.lzma ]; then xz -dc data.tar.lzma | tar -xf -; fi
          APP=$(find . -name OnyxApp -type f | head -1)
          echo "verifying: $APP"
          ldid -e "$APP" | grep -E "network.client|mapkit" && echo "ENTITLEMENTS_OK" || echo "ENTITLEMENTS_MISSING"

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: Onyx
          path: |
            packages/*.deb
          if-no-files-found: error
