# ============ Onyx CI：rootless 双架构出包 deb，并发布到越狱源 ============
# arm64（无根 Dopamine/palera1n）+ arm64e（隐根 relaxin/RootHide）各自出独立 deb
name: Build & Publish Onyx

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (theos + tools)
        run: |
          brew install make dpkg ldid gpatch libplist || true
          # 安装 theos（官方 action 太慢，直接用 beerpiss 的精简安装）
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos" || true
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "PATH=$THEOS/bin:$PATH" >> "$GITHUB_ENV"

      - name: Build dual-arch debs
        run: |
          set -e
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"
          make clean >/dev/null 2>&1 || true
          # 1) 一次 fat 构建（arm64+arm64e）→ iphoneos-arm64.deb（rootless/Dopamine，fat 二进制）
          make package FINALPACKAGE=1 ARCHS="arm64 arm64e" THEOS_PACKAGE_SCHEME=rootless
          ls -la packages/

          # 2) 从 fat 包派生 iphoneos-arm64e.deb 供隐根 relaxin/RootHide 使用
          #    （仅改写 control 的 Architecture 字段，二进制仍含 arm64e 切片）
          W=$(mktemp -d)
          dpkg-deb -x packages/*.deb "$W/root"
          dpkg-deb -e packages/*.deb "$W/root/DEBIAN"
          sed -i '' 's/^Architecture:.*/Architecture: iphoneos-arm64e/' "$W/root/DEBIAN/control"
          echo "--- derived arm64e control ---"
          grep -E '^(Package|Architecture|Version):' "$W/root/DEBIAN/control"
          # 另存派生 arm64e deb（Theos 已按 control Version 把 fat 包命名为 *_iphoneos-arm64.deb）
          dpkg-deb -b "$W/root" "packages/com.yzdmm.onyx_0.5.1_iphoneos-arm64e.deb"
          echo "--- final packages ---"
          ls -la packages/

      - name: Sign OnyxApp entitlements (per arch)
        run: |
          set -e
          for DEB in packages/*.deb; do
            echo "=== signing: $DEB ==="
            W=$(mktemp -d)
            dpkg-deb -x "$DEB" "$W/root"
            dpkg-deb -e "$DEB" "$W/root/DEBIAN"
            # 重签 App 二进制（network.client / mapkit / 定位等 entitlements）
            ENT=App/OnyxApp.entitlements
            if [ -f "$ENT" ]; then
              /usr/bin/codesign --force --sign - --entitlements "$ENT" "$W/root/var/jb/Applications/OnyxApp.app/OnyxApp" 2>/dev/null || \
              /usr/bin/codesign --force --sign - --entitlements "$ENT" "$W/root/Applications/OnyxApp.app/OnyxApp" 2>/dev/null || true
            fi
            rm -f "$DEB"
            dpkg-deb -b "$W/root" "$DEB"
            echo "ENTITLEMENTS_OK $DEB"
          done

      - name: Verify entitlements
        run: |
          for DEB in packages/*.deb; do
            W=$(mktemp -d)
            dpkg-deb -x "$DEB" "$W/root"
            APP=$(find "$W/root" -name OnyxApp -type f | head -1)
            if [ -n "$APP" ]; then
              /usr/bin/codesign -d --entitlements - "$APP" 2>/dev/null | grep -E 'com.apple.security.(network|location|mapkit)|get-task-allow' && echo "  OK: $DEB" || echo "  WARN: no ents in $DEB"
            fi
          done

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Onyx-debs
          path: packages/*.deb
